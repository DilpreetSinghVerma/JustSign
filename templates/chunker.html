{% extends 'layout.html' %}
{% block body %}
<div class="row">
  <div class="col-lg-12 mb-5">
    <div class="card">
      <div class="card-header">
        <h3>Chunker</h3>
      </div>
      <div class="card-body">
        <form action="/chunker" method="post" enctype="multipart/form-data" class="form-horizontal">
          <div class="form-group">
            <label for="rawtext">Text to Chunk:</label>
            {% if input %}
              <textarea name="rawtext" id="rawtext" rows="{{ [10,input|length]|max }}" class="form-control" required>{{ input|join('\n') }}</textarea>
            {% else %}
              <textarea name="rawtext" id="rawtext" rows="10" class="form-control" required></textarea>
            {% endif %}
          </div>
          <div class="form-group">
            <button type="submit" class="btn btn-primary">Process</button>
            <button type="reset" class="btn btn-primary pull-right">Reset</button>
          </div>
        </form>
      </div>
      {% if results %}
        <div class="card-footer">
          <div class="form-group">
            <label>Results</label>
            <textarea rows="{{ results|length }}" class="form-control" disabled>{{ results|join('\n') }}</textarea>
          </div>
        </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
