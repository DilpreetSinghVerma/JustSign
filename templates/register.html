{% extends 'layout.html' %}
{% block body %}
<div class="row">
  <div class="col-lg-12 mb-5">
    <div class="card">
      <div class="card-header">
        <h3>Register</h3>
      </div>
      <div class="card-body">
        {% if disabled %}
          Registerations are currently disabled. Kindly contact project author for registeration details.
        {% else %}
          <form method="POST">
            <div class="form-group">
              <label for="username">Email Address:</label>
              <input type="email" class="form-control" id="username" name="username" aria-describedby="emailHelp" placeholder="Enter email" required>
            </div>
            <div class="form-group">
              <label for="password">Password:</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="form-group">
              <label for="confirmpassword">Confirm Password:</label>
              <input type="password" class="form-control" id="confirmpassword" name="confirmpassword" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        {% endif %}
      </div>
      <div class="card-footer">
        <div class="text-center">
          <a href="/">Click here to return to index.</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
