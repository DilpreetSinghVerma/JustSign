{% extends 'layout.html' %}
{% block body %}
<div class="row">
  <div class="col-lg-12 mb-5">
    <div class="card">
      <div class="card-header">
        <h3>SIGML</h3>
      </div>
      <div class="card-body">
        <form action="/sigml" method="post" enctype="multipart/form-data" class="form-horizontal">
          <div class="form-group">
            <label for="rawtext">Text to Convert: <span id="filename"></span></label>
            {% if input %}
              <textarea name="rawtext" id="rawtext" rows="{{ [10,input|length]|max }}" class="form-control" required>{{ input|join('\n') }}</textarea>
            {% else %}
              <textarea name="rawtext" id="rawtext" rows="10" class="form-control" required></textarea>
            {% endif %}
          </div>
          <div class="form-group">
            <label for="textfile">Select File:</label>
            <input type="file" class="form-control-file" id="textfile" accept=".sigml">
          </div>
          <div class="form-group">
            <button type="submit" class="btn btn-primary">Process</button>
            <button type="reset" class="btn btn-primary pull-right">Reset</button>
          </div>
        </form>
      </div>
      {% if results %}
        <div class="card-footer">
          <div class="form-group">
            <label>Results</label>
            <textarea style="font-family: hamnosysunicoderegular; font-size: xx-large;" rows="{{ results|length }}" class="form-control" disabled>{{ results|join('\n') }}</textarea>
          </div>
        </div>
      {% endif %}
    </div>
  </div>
</div>
<script>
  const fileinput = document.querySelector("#textfile");
  fileinput.addEventListener("change", (e) => {
  var reader = new FileReader();
  reader.onload = function (e) {
    var textArea = document.querySelector("#rawtext");
    textArea.value = e.target.result;
  };
  document.querySelector("#filename").innerHTML = "(" + document.querySelector("#textfile").files[0].name + ")"
  console.log(document.querySelector("#textfile").files[0].name);
  reader.readAsText(document.querySelector("#textfile").files[0]);
  });
</script>
{% endblock %}
